function renderIcons(){
  document.querySelectorAll('[data-lucide]').forEach(el=>{
    const name = el.getAttribute('data-lucide');
    const inner = ICONS[name];
    if(!inner) return;
    const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svgEl.setAttribute('viewBox','0 0 24 24');
    svgEl.setAttribute('fill','none');
    svgEl.setAttribute('stroke','currentColor');
    svgEl.setAttribute('stroke-width','2');
    svgEl.setAttribute('stroke-linecap','round');
    svgEl.setAttribute('stroke-linejoin','round');
    const cls = el.getAttribute('class');
    if(cls) svgEl.setAttribute('class', cls);
    const sty = el.getAttribute('style');
    if(sty) svgEl.setAttribute('style', sty);
    svgEl.innerHTML = inner;
    el.replaceWith(svgEl);
  });
}

const STORAGE_KEY = 'duoEnglishState_v1';
const LESSON_TYPES = ['Читання','Граматика','Вивчення слів','Аудіювання','Розмовна практика','Письмо'];
const MONTHS_UA = ['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
const WEEKDAYS_UA = ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];

/* ============================= CROSS-DEVICE SYNC (Firebase) =============================
   Fill these in with YOUR OWN free Firebase project's config to make Дана and Вова see
   each other's history live from any device. Steps: see the setup guide sent alongside
   this file. Until you fill this in, the app works fine but only on this one device
   (data stays in this browser's localStorage). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAkcr8enJ6W99Hqdp51M_yquHiipGR4oUM",
  authDomain: "english-tracker-123.firebaseapp.com",
  databaseURL: "https://english-tracker-123-default-rtdb.firebaseio.com",
  projectId: "english-tracker-123",
  storageBucket: "english-tracker-123.firebasestorage.app",
  messagingSenderId: "707043444802",
  appId: "1:707043444802:web:654ceeebebb44555f985db"
};
const SYNC_ENABLED = FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY"
  && !FIREBASE_CONFIG.databaseURL.includes("YOUR_PROJECT")
  && typeof firebase !== 'undefined';
let syncDbRef = null;
let syncStatus = SYNC_ENABLED ? 'connecting' : 'offline'; // 'connecting' | 'online' | 'offline' | 'error'

function defaultState(){
  return {
    users: { me: 'Дана', friend: 'Вова' },
    activeProfile: 'me',
    lessons: [],
    links: []
  };
}

function loadLocalCache(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed, {
      users: Object.assign({me:'Дана',friend:'Вова'}, parsed.users||{}),
      lessons: Array.isArray(parsed.lessons)?parsed.lessons:[],
      links: Array.isArray(parsed.links)?parsed.links:[]
    });
  }catch(e){ return defaultState(); }
}

/* Only users/lessons/links are shared across devices. activeProfile (which profile
   THIS device is currently viewing) stays local on purpose — so opening the app on
   Вова's computer doesn't force-switch what Дана sees on hers, and vice versa. */
function persistLocalCache(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      users: state.users,
      activeProfile: state.activeProfile,
      lessons: state.lessons,
      links: state.links
    }));
  }catch(e){ /* storage unavailable — ignore */ }
}

function saveState(){
  persistLocalCache();
  if(SYNC_ENABLED && syncDbRef){
    syncDbRef.set({
      users: state.users,
      lessons: state.lessons,
      links: state.links
    }).catch(err=>{
      console.error('Sync write failed:', err);
      syncStatus = 'error';
      toast('Немає звʼязку із сервером — зміни збережено лише тут');
      render();
    });
  }
}

function initSync(){
  if(!SYNC_ENABLED){
    state.loaded = true;
    render();
    return;
  }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    syncDbRef = firebase.database().ref('duoEnglishTracker');
    syncDbRef.on('value', snapshot=>{
      const remote = snapshot.val();
      if(remote){
        state.users = Object.assign({me:'Дана',friend:'Вова'}, remote.users||{});
        state.lessons = Array.isArray(remote.lessons) ? remote.lessons : [];
        state.links = Array.isArray(remote.links) ? remote.links : [];
      }
      state.loaded = true;
      syncStatus = 'online';
      persistLocalCache();
      render();
    }, err=>{
      console.error('Sync read failed:', err);
      syncStatus = 'error';
      state.loaded = true; // fall back to local cache so the app is still usable
      render();
    });
  }catch(e){
    console.error('Firebase init failed:', e);
    syncStatus = 'error';
    state.loaded = true;
    render();
  }
}

/* ============================= HELPERS ============================= */
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function pad2(n){ return String(n).padStart(2,'0'); }
function toLocalISO(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function todayISO(){ return toLocalISO(new Date()); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDate(s){ const d=parseISO(s); return `${pad2(d.getDate())}.${pad2(d.getMonth()+1)}`; }
function fmtDateFull(s){ const d=parseISO(s); return `${WEEKDAYS_UA[d.getDay()]}, ${d.getDate()} ${MONTHS_UA[d.getMonth()]} ${d.getFullYear()}`; }
function formatDMY(iso){
  if(!iso) return '';
  const d = parseISO(iso);
  return `${pad2(d.getDate())}.${pad2(d.getMonth()+1)}.${d.getFullYear()}`;
}
function parseDMY(str){
  if(!str) return null;
  const m = str.trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(!m) return null;
  const dd = parseInt(m[1],10), mm = parseInt(m[2],10), yyyy = parseInt(m[3],10);
  if(mm<1||mm>12||dd<1||dd>31||yyyy<1900) return null;
  const d = new Date(yyyy, mm-1, dd);
  if(d.getFullYear()!==yyyy || d.getMonth()!==mm-1 || d.getDate()!==dd) return null;
  return toLocalISO(d);
}
function dayDiff(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function minutesToLabel(min){
  if(min<60) return `${min} хв`;
  const h=Math.floor(min/60), m=min%60;
  return m? `${h} год ${m} хв` : `${h} год`;
}
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function ensureUrl(u){
  if(!/^https?:\/\//i.test(u)) return 'https://'+u;
  return u;
}

/* ============================= COMPUTED ============================= */
function otherProfile(profile){ return profile==='me' ? 'friend' : 'me'; }

function getProfileLessons(profile){
  return state.lessons.filter(l=>l.owner===profile).sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt-a.createdAt);
}

function computeStats(profile){
  const lessons = getProfileLessons(profile);
  const dateSet = new Set(lessons.map(l=>l.date));
  const activeDays = dateSet.size;
  const totalMinutes = lessons.reduce((s,l)=>s+(l.durationMinutes||0),0);

  let missedDays = 0, firstDate = null;
  if(lessons.length){
    firstDate = lessons.reduce((min,l)=> l.date<min?l.date:min, lessons[0].date);
    const span = dayDiff(firstDate, todayISO()) + 1;
    missedDays = Math.max(0, span - activeDays);
  }

  // streak: consecutive days ending today or yesterday
  let streak = 0;
  let cursor = new Date();
  // if today has no entry, start checking from yesterday but don't break streak for "today not yet logged"
  if(!dateSet.has(todayISO())) cursor.setDate(cursor.getDate()-1);
  while(true){
    const iso = toLocalISO(cursor);
    if(dateSet.has(iso)){ streak++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }

  // last 7 days minutes
  const last7 = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = toLocalISO(d);
    const mins = lessons.filter(l=>l.date===iso).reduce((s,l)=>s+(l.durationMinutes||0),0);
    last7.push({ iso, label: WEEKDAYS_UA[d.getDay()], mins });
  }
  const thisWeekDays = last7.filter(d=>d.mins>0).length;

  // type breakdown
  const typeMinutes = {};
  LESSON_TYPES.forEach(t=>typeMinutes[t]=0);
  lessons.forEach(l=>{
    (l.types||[]).forEach(t=>{ typeMinutes[t] = (typeMinutes[t]||0) + (l.durationMinutes||0); });
  });

  return { activeDays, totalMinutes, missedDays, streak, last7, thisWeekDays, typeMinutes, lessonsCount: lessons.length };
}

function computeStatsForPeriod(profile, days){
  const lessons = getProfileLessons(profile);
  const startDate = new Date(); startDate.setDate(startDate.getDate()-(days-1));
  const startISO = toLocalISO(startDate);
  const periodLessons = lessons.filter(l=> l.date >= startISO && l.date <= todayISO());

  const dateSet = new Set(periodLessons.map(l=>l.date));
  const activeDays = dateSet.size;
  const totalMinutes = periodLessons.reduce((s,l)=>s+(l.durationMinutes||0),0);
  const missedDays = Math.max(0, days - activeDays);

  const typeMinutes = {};
  LESSON_TYPES.forEach(t=>typeMinutes[t]=0);
  periodLessons.forEach(l=>{
    (l.types||[]).forEach(t=>{ typeMinutes[t] = (typeMinutes[t]||0) + (l.durationMinutes||0); });
  });

  // build chart buckets (max ~30 bars, so bucket size grows with period length)
  // buckets are ordered newest → oldest, so the first (leftmost) point is always today
  const bucketSize = Math.max(1, Math.ceil(days/30));
  const buckets = [];
  for(let i=0;i<=days-1;i+=bucketSize){
    const bucketDays = [];
    const highestOffset = Math.min(days-1, i+bucketSize-1);
    for(let j=i;j<=highestOffset;j++){
      const d = new Date(); d.setDate(d.getDate()-j);
      bucketDays.push(d);
    }
    let mins = 0;
    bucketDays.forEach(d=>{
      const iso = toLocalISO(d);
      mins += periodLessons.filter(l=>l.date===iso).reduce((s,l)=>s+(l.durationMinutes||0),0);
    });
    // bucketDays[0] is the most recent day in this bucket, last is the oldest
    const newest = bucketDays[0], oldest = bucketDays[bucketDays.length-1];
    const label = bucketSize===1
      ? WEEKDAYS_UA[newest.getDay()]
      : `${oldest.getDate()}–${newest.getDate()} ${MONTHS_UA[newest.getMonth()]}`;
    buckets.push({ label, mins });
  }

  return { activeDays, totalMinutes, missedDays, typeMinutes, buckets, days };
}

  attachEvents();
  renderIcons();
}

  const tabs = [

function renderTracker(){
  const profile = state.activeProfile;
  const all = getProfileLessons(profile);
  const active = all.filter(l=>!l.archived);
  const archived = all.filter(l=>l.archived);

  return `

/* ============================= STATS TAB ============================= */
function statCard(icon,label,value,sub){
  return `
  <div class="rounded-3xl border p-5 card-hover fade-in" style="border-color:var(--border)">
    <div class="w-10 h-10 rounded-2xl flex items-center justify-center mb-3" style="background:var(--blue-pastel)">
      <i data-lucide="${icon}" class="w-5 h-5" style="color:var(--blue-deep)"></i>
    </div>
    <div class="font-display font-extrabold text-2xl">${value}</div>
    <div class="text-sm font-medium mt-0.5">${label}</div>
    ${sub? `<div class="text-xs mt-1" style="color:var(--ink-faint)">${sub}</div>`:''}
  </div>`;
}

const STATS_PERIODS = [
  { key: '7', label: '7 днів' },
  { key: '30', label: '30 днів' },
  { key: '100', label: '100 днів' },
  { key: 'all', label: 'Весь період' }
];

function resolvePeriodDays(profile, key){
  if(key !== 'all') return parseInt(key,10);
  const lessons = getProfileLessons(profile);
  if(!lessons.length) return 1;
  const firstDate = lessons.reduce((min,l)=> l.date<min?l.date:min, lessons[0].date);
  return Math.max(1, dayDiff(firstDate, todayISO()) + 1);
}

function periodSwitcher(){
  return `
  <div class="flex items-center gap-2 p-1.5 rounded-2xl w-full overflow-x-auto scroll-thin" style="background:var(--bg-soft)">
    ${STATS_PERIODS.map(p=>`
      <button data-action="set-stats-period" data-period="${p.key}"
        class="btn-press px-3.5 py-2 rounded-xl text-sm font-semibold whitespace-nowrap shrink-0 ${ui.statsPeriod===p.key?'bg-white shadow-sm':''}"
        style="color:${ui.statsPeriod===p.key?'var(--blue-deep)':'var(--ink-soft)'}">
        ${p.label}
      </button>`).join('')}
  </div>`;
}

function renderStats(){
  const profile = state.activeProfile;
  const overall = computeStats(profile); // for lifetime lesson count + streak
  const periodDays = resolvePeriodDays(profile, ui.statsPeriod);
  const period = computeStatsForPeriod(profile, periodDays);
  const maxType = Math.max(1, ...Object.values(period.typeMinutes));
  const periodLabel = ui.statsPeriod==='all' ? `за весь період (${periodDays} дн.)` : `за останні ${periodDays} днів`;

  return `
  <section class="max-w-5xl mx-auto px-5 py-6 space-y-6">
    <div class="flex items-center justify-between flex-wrap gap-3">
      <h2 class="font-display font-bold text-lg">Статистика — ${escapeHtml(state.users[profile])}</h2>
      <span class="text-xs px-3 py-1.5 rounded-full" style="background:var(--bg-soft);color:var(--ink-soft)">Дані ${periodLabel}</span>
    </div>

    ${periodSwitcher()}

    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
      ${statCard('calendar-check','днів навчання', period.activeDays, `з ${overall.lessonsCount} записів усього`)}
      ${statCard('clock','приділено часу', minutesToLabel(period.totalMinutes))}
      ${statCard('calendar-x','днів пропущено', period.missedDays, periodLabel)}
      ${statCard('flame','поточна серія', `${overall.streak} дн.`)}
    </div>

    <div class="rounded-3xl border p-5 sm:p-6 fade-in" style="border-color:var(--border)">
      <h3 class="font-display font-bold text-lg mb-4 flex items-center gap-2"><i data-lucide="pie-chart" class="w-5 h-5" style="color:var(--blue)"></i>Час за типом занять</h3>
      <div class="space-y-3">
        ${LESSON_TYPES.map(t=>`
          <div>
            <div class="flex justify-between text-xs mb-1">
              <span class="font-medium" style="color:var(--ink-soft)">${t}</span>
              <span style="color:var(--ink-faint)">${minutesToLabel(period.typeMinutes[t]||0)}</span>
            </div>
            <div class="h-2.5 rounded-full w-full" style="background:var(--bg-soft)">
              <div class="h-2.5 rounded-full" style="width:${((period.typeMinutes[t]||0)/maxType)*100}%; background:var(--blue-pastel); box-shadow: inset 0 0 0 9999px var(--blue-pastel);"></div>
            </div>
          </div>`).join('')}
      </div>
    </div>
  </section>`;
}

        <p class="text-xs" style="color:var(--ink-soft)">
          ${syncStatus==='online'
            ? 'Записи, нотатки й посилання оновлюються на обох пристроях автоматично.'
            : 'Зараз дані зберігаються лише в цьому браузері. Щоб Дана і Вова бачили історію одне одного з будь-якого пристрою, потрібно один раз підключити безкоштовну базу даних (Firebase) — інструкція була надіслана окремо.'}
        </p>
      </div>

      <div class="h-px my-5" style="background:var(--border)"></div>

      <div class="space-y-3">
        <button data-action="export-data" class="btn-press w-full flex items-center justify-center gap-2 py-2.5 rounded-2xl font-semibold text-sm border" style="border-color:var(--border)">
          <i data-lucide="download" class="w-4 h-4"></i> Експортувати дані у JSON
        </button>
        <label class="btn-press w-full flex items-center justify-center gap-2 py-2.5 rounded-2xl font-semibold text-sm border cursor-pointer" style="border-color:var(--border)">
          <i data-lucide="upload" class="w-4 h-4"></i> Імпортувати дані з JSON
          <input id="import-input" type="file" accept="application/json" class="hidden">
        </label>
        <p class="text-xs text-center" style="color:var(--ink-faint)">Це резервна копія на випадок втрати даних — синхронізацію між пристроями вона не забезпечує.</p>
      </div>
    </div>
  </div>`;
}

function renderToast(){
  if(!ui.toast) return '';
  return `<div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 fade-in px-5 py-3 rounded-2xl text-sm font-medium text-white shadow-lg" style="background:var(--ink)">${escapeHtml(ui.toast)}</div>`;
}

function toast(msg){
  ui.toast = msg;
  render();
  setTimeout(()=>{ ui.toast=null; render(); }, 2200);
}

/* ============================= EVENTS ============================= */
function attachEvents(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-action]').forEach(el=>{
    const action = el.getAttribute('data-action');
    if(action==='close-modal-backdrop'){
      el.addEventListener('click', ()=>{ ui.showModal=false; render(); });
      return;
    }
    el.addEventListener('click', (e)=>{
      switch(action){
        case 'set-profile':
          state.activeProfile = el.dataset.user; saveState(); render(); break;
        case 'set-tab':
          ui.tab = el.dataset.tab; ui.showArchive=false; render(); break;
        case 'toggle-archive':
          ui.showArchive = !ui.showArchive; render(); break;
        case 'set-stats-period':
          ui.statsPeriod = el.dataset.period; render(); break;
        case 'toggle-archive-lesson': {
          const l = state.lessons.find(x=>x.id===el.dataset.id);
          if(l){ l.archived = !l.archived; saveState(); render(); }
          break;
        }
        case 'delete-lesson':
          if(confirm('Видалити цей запис назавжди?')){
            state.lessons = state.lessons.filter(x=>x.id!==el.dataset.id);
            saveState(); render();
          }
          break;
        case 'toggle-type': {
          const t = el.dataset.type;
          ui.formTypes = ui.formTypes.includes(t) ? ui.formTypes.filter(x=>x!==t) : [...ui.formTypes, t];
          render();
          break;
        }
        case 'open-date-picker': {
          const picker = document.getElementById('hidden-date-picker');
          if(picker){
            if(typeof picker.showPicker === 'function'){
              try{ picker.showPicker(); } catch(err){ picker.focus(); picker.click(); }
            } else {
              picker.focus();
              picker.click();
            }
          }
          break;
        }
        case 'toggle-link-form':
          ui.linkFormOpen = !ui.linkFormOpen; render(); break;
        case 'delete-link':
          if(confirm('Видалити це посилання?')){
            state.links = state.links.filter(x=>x.id!==el.dataset.id);
            saveState(); render();
          }
          break;
        case 'open-modal':
          ui.showModal = true; render(); break;
        case 'close-modal':
          ui.showModal = false; render(); break;
        case 'save-names': {
          const meVal = document.getElementById('name-me').value.trim();
          const frVal = document.getElementById('name-friend').value.trim();
          if(meVal) state.users.me = meVal;
          if(frVal) state.users.friend = frVal;
          saveState(); ui.showModal=false; render(); toast('Імена оновлено');
          break;
        }
        case 'export-data': {
          const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `duo-english-progress-${todayISO()}.json`;
          document.body.appendChild(a); a.click(); a.remove();
          toast('Дані експортовано');
          break;
        }
      }
    });
  });

  const importInput = document.getElementById('import-input');
  if(importInput){
    importInput.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        try{
          const parsed = JSON.parse(ev.target.result);
          state = Object.assign(defaultState(), parsed, {
            users: Object.assign({me:'Дана',friend:'Вова'}, parsed.users||{}),
            lessons: Array.isArray(parsed.lessons)?parsed.lessons:[],
            links: Array.isArray(parsed.links)?parsed.links:[],
            loaded: true
          });
          saveState(); ui.showModal=false; render(); toast('Дані імпортовано успішно');
        }catch(err){
          alert('Не вдалося прочитати файл. Перевірте формат JSON.');
        }
      };
      reader.readAsText(file);
    });
  }

  app.querySelectorAll('[data-comment-form]').forEach(form=>{
    form.addEventListener('submit', (e)=>{
      e.preventDefault();
      const id = form.dataset.id;
      const input = form.querySelector('input[name="comment"]');
      const text = input.value.trim();
      if(!text) return;
      const l = state.lessons.find(x=>x.id===id);
      if(l){
        if(!l.comments) l.comments = [];
        l.comments.push({ id: uid(), author: otherProfile(l.owner), text, createdAt: Date.now() });
        saveState();
        render();
      }
    });
  });

  const lessonForm = document.getElementById('lesson-form');
  if(lessonForm){
    const fDateText = lessonForm.querySelector('[name="dateText"]');
    const fDatePicker = document.getElementById('hidden-date-picker');
    const fDuration = lessonForm.querySelector('[name="duration"]');
    const fUnit = lessonForm.querySelector('[name="unit"]');
    const fActivity = lessonForm.querySelector('[name="activity"]');
    const fTopic = lessonForm.querySelector('[name="topic"]');
    const fNotes = lessonForm.querySelector('[name="notes"]');

    fDateText.addEventListener('input', e=>{ ui.formDateText = e.target.value; });
    fDuration.addEventListener('input', e=>{ ui.formDuration = e.target.value; });
    fUnit.addEventListener('change', e=>{ ui.formUnit = e.target.value; });
    fActivity.addEventListener('input', e=>{ ui.formActivity = e.target.value; });
    fTopic.addEventListener('input', e=>{ ui.formTopic = e.target.value; });
    fNotes.addEventListener('input', e=>{ ui.formNotes = e.target.value; });

    if(fDatePicker){
      fDatePicker.addEventListener('change', e=>{
        const iso = e.target.value;
        if(iso){
          ui.formDate = iso;
          ui.formDateText = formatDMY(iso);
          render();
        }
      });
    }

    lessonForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      // sync latest values in case a browser autofill skipped the input event
      ui.formDateText = fDateText.value;
      ui.formDuration = fDuration.value;
      ui.formUnit = fUnit.value;
      ui.formActivity = fActivity.value;
      ui.formTopic = fTopic.value;
      ui.formNotes = fNotes.value;

      const parsedDate = parseDMY(ui.formDateText);

      const errors = {};
      if(!parsedDate) errors.date = true;
      else if(parsedDate > todayISO()) errors.date = true;
      if(!ui.formActivity || !ui.formActivity.trim()) errors.activity = true;
      const durNum = parseInt(ui.formDuration,10);
      if(!ui.formDuration || isNaN(durNum) || durNum<=0) errors.duration = true;

      if(Object.keys(errors).length){
        ui.formErrors = errors;
        render();
        toast('Заповніть позначені поля');
        return;
      }

      let duration = durNum;
      if(ui.formUnit==='hour') duration = duration*60;

      state.lessons.push({
        id: uid(),
        owner: state.activeProfile,
        date: parsedDate,
        activity: ui.formActivity.trim(),
        types: [...ui.formTypes],
        durationMinutes: duration,
        topic: (ui.formTopic||'').trim(),
        notes: (ui.formNotes||'').trim(),
        archived: false,
        comments: [],
        createdAt: Date.now()
      });
      saveState();
      ui.formTypes = [];
      ui.formDate = todayISO();
      ui.formDateText = null;
      ui.formUnit = 'min';
      ui.formDuration = '';
      ui.formActivity = '';
      ui.formTopic = '';
      ui.formNotes = '';
      ui.formErrors = {};
      render();
      toast('Запис додано');
    });
  }

  const linkForm = document.getElementById('link-form');
  if(linkForm){
    linkForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      const fd = new FormData(linkForm);
      state.links.push({
        id: uid(),
        title: fd.get('title').trim(),
        url: fd.get('url').trim(),
        note: (fd.get('note')||'').trim(),
        addedBy: state.activeProfile,
        createdAt: Date.now()
      });
      saveState();
      ui.linkFormOpen = false;
      render();
      toast('Сайт додано');
    });
  }
}

/* ============================= INIT ============================= */
initSync();
</script>
</body>
</html>
